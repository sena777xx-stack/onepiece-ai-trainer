<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OP AI Trainer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>ONE PIECE CARD AI TRAINER</title>
</head>
<body>
  <div id="installHint" class="install-hint hidden">
    Safariの共有ボタンから「ホーム画面に追加」を選んでください。
    <button id="closeInstallHint">閉じる</button>
  </div>

  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">SOLO TRAINING</p>
        <h1>ONE PIECE CARD AI TRAINER</h1>
      </div>
      <button id="resetBtn" class="ghost-btn">リセット</button>
    </header>

    <main>
      <section id="setupScreen" class="screen active">
        <div class="hero-card">
          <p class="eyebrow">フラッグシップ前に100戦練習</p>
          <h2>スマホ専用AI対戦</h2>
          <p>ホーム画面に追加して、アプリのように使えます。カード画像は端末内に保存されます。</p>
        </div>

        <div class="panel">
          <label class="field"><span>自分のデッキ</span>
            <select id="playerDeckSelect"><option value="green-shanks">緑シャンクス（試作）</option></select>
          </label>

          <label class="field"><span>対戦AI</span>
            <select id="aiDeckSelect">
              <option value="purple-enel">紫エネル</option>
              <option value="blue-yellow-nami">青黄ナミ</option>
              <option value="red-blue-lucy">赤青ルーシー</option>
              <option value="green-blue-luffy">緑青ルフィ</option>
              <option value="black-yellow-teach">黒黄ティーチ</option>
              <option value="random">環境ランダム</option>
            </select>
          </label>

          <label class="field"><span>AI難易度</span>
            <select id="difficultySelect">
              <option value="easy">EASY</option>
              <option value="normal" selected>NORMAL</option>
              <option value="hard">HARD</option>
            </select>
          </label>

          <label class="field"><span>先攻・後攻</span>
            <select id="turnOrderSelect">
              <option value="first">先攻</option>
              <option value="second">後攻</option>
              <option value="random">ランダム</option>
            </select>
          </label>

          <button id="startBtn" class="primary-btn">AI対戦を開始</button>
          <button id="imageManagerBtn" class="secondary-btn">カード画像を登録</button>
          <button id="showInstallBtn" class="secondary-btn">ホーム画面への追加方法</button>
        </div>
      </section>

      <section id="gameScreen" class="screen">
        <div class="status-row">
          <div>
            <span id="turnBadge" class="badge">TURN 1</span>
            <span id="phaseBadge" class="badge muted">自分のターン</span>
          </div>
          <button id="speedBtn" class="ghost-btn compact">AI速度 ×1</button>
        </div>

        <section class="board ai-board">
          <div class="player-summary">
            <div><p class="eyebrow">AI</p><h3 id="aiDeckName">紫エネル</h3></div>
            <div class="mini-stats">
              <span>手札 <b id="aiHandCount">5</b></span>
              <span>ライフ <b id="aiLifeCount">5</b></span>
              <span>DON!! <b id="aiDonCount">0/0</b></span>
            </div>
          </div>
          <div id="aiLeaderZone" class="leader-zone"></div>
          <div id="aiField" class="card-row field-row"></div>
        </section>

        <section class="center-strip">
          <button id="logBtn" class="ghost-btn compact">ログ</button>
          <div class="vs">VS</div>
          <button id="undoBtn" class="ghost-btn compact">1手戻す</button>
        </section>

        <section class="board player-board">
          <div id="playerField" class="card-row field-row"></div>
          <div id="playerLeaderZone" class="leader-zone"></div>
          <div class="player-summary">
            <div><p class="eyebrow">YOU</p><h3>緑シャンクス</h3></div>
            <div class="mini-stats">
              <span>ライフ <b id="playerLifeCount">5</b></span>
              <span>DON!! <b id="playerDonCount">0/0</b></span>
            </div>
          </div>
          <div class="hand-header"><span>手札</span><span id="playerHandCount">5枚</span></div>
          <div id="playerHand" class="card-row hand-row"></div>
        </section>
      </section>
    </main>

    <nav id="actionBar" class="action-bar hidden">
      <button id="drawBtn">ドロー</button>
      <button id="donBtn">DON!!追加</button>
      <button id="attackBtn">攻撃</button>
      <button id="endTurnBtn" class="accent">ターン終了</button>
    </nav>
  </div>

  <dialog id="cardDialog"><div class="dialog-shell">
    <button class="dialog-close" data-close-dialog>×</button>
    <div id="dialogCardPreview"></div><div id="dialogActions" class="dialog-actions"></div>
  </div></dialog>

  <dialog id="logDialog"><div class="dialog-shell">
    <button class="dialog-close" data-close-dialog>×</button>
    <h3>対戦ログ</h3><div id="logList" class="log-list"></div>
  </div></dialog>

  <dialog id="imageDialog"><div class="dialog-shell">
    <button class="dialog-close" data-close-dialog>×</button>
    <h3>カード画像管理</h3>
    <p class="small-text">カードを選び、端末内の画像を登録してください。登録内容はこの端末のブラウザ内に保存されます。</p>
    <label class="field"><span>カード</span><select id="imageCardSelect"></select></label>
    <label class="upload-box"><input id="imageUploadInput" type="file" accept="image/*" /><span>画像を選択</span></label>
    <button id="clearImagesBtn" class="danger-btn">登録画像をすべて削除</button>
  </div></dialog>

  <script src="app.js"></script>
</body>
</html>
